      - name: Fetch Telegram-Android sources (pinned commit)
        run: |
          mkdir tg && cd tg
          git init -q
          git remote add origin https://github.com/DrKLO/Telegram.git
          git fetch --depth 1 origin "$UPSTREAM_SHA"
          git checkout -q FETCH_HEAD

      - name: Apply Koch Gram changes
        working-directory: tg
        run: |
          git apply --whitespace=nowarn ../kochgram/kochgram.patch
          cp -r ../kochgram/overlay/. .

      - name: Set own api_id / api_hash (optional, from repo secrets)
        working-directory: tg
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ]; then
            sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = $TG_API_ID;/" $F
            sed -i "s/public static String APP_HASH = \"[0-9a-f]*\";/public static String APP_HASH = \"$TG_API_HASH\";/" $F
            grep -n "APP_ID =\|APP_HASH =" $F | sed 's/"[0-9a-f]\{32\}"/"***"/'
          else
            echo "TG_API_ID / TG_API_HASH secrets not set, using the defaults from the source"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: tg
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir out
          find tg/TMessagesProj_App/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: KochGram-apk
          path: out/*.apk
